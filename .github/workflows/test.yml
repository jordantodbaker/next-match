name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` runs the `postinstall` prisma generate, which only reads the
      # schema (no DB connection needed). Tests mock Prisma/Clerk, so no
      # DATABASE_URL or Clerk secrets are required.
      - run: npm ci
      - run: npm test
